{% extends "base.html" %}
{% block title %}Register Patient Account — CarePulse Hospital{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="max-width:680px;">
    <div class="card">
      <h1 style="margin-top:0;">Create Your Patient Health Account</h1>
      <p class="card-muted">Store your emergency medical profile, track vitals, and manage hospital appointments.</p>

      <form method="post" action="{{ url_for('register') }}">
        <div class="form-grid">
          <div class="form-group">
            <label for="full_name">Full Name</label>
            <input class="form-control" id="full_name" name="full_name" required />
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input class="form-control" id="email" type="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password (min 6 chars)</label>
            <input class="form-control" id="password" type="password" name="password" minlength="6" required />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input class="form-control" id="phone" name="phone" required />
          </div>
          <div class="form-group">
            <label for="date_of_birth">Date of Birth</label>
            <input class="form-control" id="date_of_birth" type="date" name="date_of_birth" required />
          </div>
          <div class="form-group">
            <label for="gender">Gender</label>
            <select class="form-control" id="gender" name="gender">
              <option>Female</option>
              <option>Male</option>
              <option>Non-binary</option>
              <option>Prefer not to say</option>
            </select>
          </div>
          <div class="form-group">
            <label for="blood_group">Blood Group</label>
            <select class="form-control" id="blood_group" name="blood_group">
              <option>O+</option><option>O-</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option>
              <option>Unknown</option>
            </select>
          </div>
          <div class="form-group">
            <label for="emergency_contact">Emergency Contact (Name &amp; Phone)</label>
            <input class="form-control" id="emergency_contact" name="emergency_contact" required placeholder="e.g. Priya Sharma (+91 98201...)" />
          </div>
        </div>
        <div class="form-group">
          <label for="allergies">Known Allergies (optional)</label>
          <input class="form-control" id="allergies" name="allergies" placeholder="e.g. Penicillin, Peanuts, or None" />
        </div>
        <button class="btn btn-primary" type="submit">Create Patient Portal</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
